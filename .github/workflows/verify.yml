name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Verify complete locked stack
        run: |
          chmod +x scripts/*.sh tests/*.sh
          scripts/verify-stack.sh
      - name: Build reproducible source snapshot
        run: scripts/build-snapshot.sh
      - name: Upload stack snapshot
        uses: actions/upload-artifact@v4
        with:
          name: tonal-stack-snapshot
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
